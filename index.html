<!DOCTYPE html>
<html lang="sq" data-theme="light">

  <title>NTP Ratkoci, marketi në Ratkoc</title>

  <meta name="theme-color" content="#1F4BD8">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ratkoci">

  <meta property="og:title" content="NTP Ratkoci">
  <meta property="og:description" content="Marketi i lagjes në Ratkoc që nga 1989. Çmimet, lista e blerjes dhe orari.">
  <meta property="og:image" content="assets/img/store-1600.webp">
  <meta property="og:type" content="website">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/favicon-64.png">

  <link rel="stylesheet" href="assets/css/app.css">

  <!-- Tema para ngarkimit, që të mos ketë "flash" -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ntp.theme') || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Kalo te përmbajtja</a>

  </svg>

  <!-- ===================== KOKA ===================== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="NTP Ratkoci, fillimi">
        <span class="brand-mark" aria-hidden="true">NTP</span>
        <span class="brand-name">Ratkoci</span>
      </a>

      <nav class="nav" aria-label="Kryesore">
        <a href="#/" data-nav="home" class="nav-link"><svg class="ic"><use href="#i-home"/></svg><span>Fillimi</span></a>
        <a href="#/produktet" data-nav="produktet" class="nav-link"><svg class="ic"><use href="#i-grid"/></svg><span>Produktet</span></a>
        <a href="#/lista" data-nav="lista" class="nav-link"><svg class="ic"><use href="#i-list"/></svg><span>Lista</span><b class="badge" data-list-count hidden></b></a>
        <a href="#/marketi" data-nav="marketi" class="nav-link"><svg class="ic"><use href="#i-store"/></svg><span>Marketi</span></a>
      </nav>

      <button class="search-trigger" type="button" data-open-search aria-label="Kërko produkte">
        <svg class="ic"><use href="#i-search"/></svg>
        <span class="search-trigger-text">Kërko</span>
        <kbd>/</kbd>
      </button>
    </div>
  </header>

  <!-- ===================== PËRMBAJTJA ===================== -->
  <main id="main" class="main" tabindex="-1">
    <div id="view" class="view" aria-live="polite"></div>
  </main>

  <footer class="footer">
    <p><strong>NTP Ratkoci</strong>, Rruga Safet Latifi, Ratkoc. Hapur çdo ditë 08:00–21:00.</p>
    <p class="footer-small">Çmimet mund të ndryshojnë. Për çmimin e saktë pyet në arkë.</p>
  </footer>

  <!-- ===================== NAVIGIMI NË CELULAR ===================== -->
  <nav class="dock" aria-label="Navigimi">
    <a href="#/" data-nav="home"><svg class="ic"><use href="#i-home"/></svg><span>Fillimi</span></a>
    <a href="#/produktet" data-nav="produktet"><svg class="ic"><use href="#i-grid"/></svg><span>Produktet</span></a>
    <a href="#/lista" data-nav="lista"><svg class="ic"><use href="#i-list"/></svg><span>Lista</span><b class="badge" data-list-count hidden></b></a>
    <a href="#/marketi" data-nav="marketi"><svg class="ic"><use href="#i-store"/></svg><span>Marketi</span></a>
  </nav>

  <!-- ===================== PRODUKTI (sheet) ===================== -->
  <div class="sheet" id="product-sheet" hidden>
    <div class="sheet-scrim" data-close-sheet></div>
    <section class="sheet-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="ps-title">
      <button class="icon-btn sheet-close" type="button" data-close-sheet aria-label="Mbyll"><svg class="ic"><use href="#i-x"/></svg></button>
      <div class="ps-media"><img id="ps-img" alt="" width="600" height="600"></div>
      <div class="ps-body">
        <p class="ps-cat" id="ps-cat"></p>
        <h2 class="ps-title" id="ps-title"></h2>
        <div class="ps-price" id="ps-price"></div>
        <div class="ps-actions" id="ps-actions"></div>
        <div class="ps-related">
          <h3 class="h-small">Në të njëjtin raft</h3>
          <div class="rail" id="ps-related"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- ===================== KËRKIMI ===================== -->
  <div class="search" id="search" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="Kërko">
      <div class="search-bar">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="search-input" type="search" inputmode="search" autocomplete="off" enterkeyhint="search"
               placeholder="Kërko produkt, ose pyet: a jeni hapur?" aria-label="Kërko">
        <button class="icon-btn" type="button" data-close-search aria-label="Mbyll kërkimin"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
      <div class="search-body" id="search-results"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Aktivizo JavaScript për të parë katalogun e NTP Ratkoci.</p></noscript>

  <!-- ===================== SKRIPTAT ===================== -->
  <script src="assets/js/data/products.js" defer></script>
  <script src="assets/js/core.js" defer></script>
  <script src="assets/js/status.js" defer></script>
  <script src="assets/js/views.js" defer></script>
  <script src="assets/js/search.js" defer></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
